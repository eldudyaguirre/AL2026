<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AL2026 - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #3f3f3f;
      color: #222;
    }

    /* CABECERA inspirada en el diseño del index */
    .site-header {
      width: 100%;
      padding: 34px 24px 28px;
      background: #3f3f3f;
    }

    .header-top {
      width: min(1180px, 100%);
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #1685c7, #07527f);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }

    .brand-name {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 700;
      letter-spacing: .5px;
    }

    .header-title {
      color: #21c4c9;
      text-align: right;
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .menu-container {
      width: min(1180px, 100%);
      margin: 0 auto;
      min-height: 190px;
      padding: 30px 24px;
      background: #ededed;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .menu {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 28px;
      list-style: none;
      text-transform: uppercase;
      font-weight: 600;
    }

    .menu li {
      list-style: none;
      overflow: hidden;
    }

    .menu a {
      display: inline-block;
      position: relative;
      padding: 8px 5px;
      color: rgba(7,54,116,.65);
      text-decoration: none;
      letter-spacing: 1px;
      font-size: 15px;
      transition: transform .35s ease, color .35s ease;
    }

    .menu a::before {
      position: absolute;
      display: block;
      right: -6px;
      top: 0;
      width: 3px;
      height: 100%;
      content: "";
      background: #24be24;
      transform: scaleY(0);
      transform-origin: center;
      transition: transform .35s ease;
    }

    .menu a:hover,
    .menu a.active {
      color: #073674;
      transform: translateX(-3px);
    }

    .menu a:hover::before,
    .menu a.active::before {
      transform: scaleY(1);
    }

    /* CONTENIDO DEL DASHBOARD */
    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 0 24px 40px;
    }

    .dashboard-heading {
      margin: 4px 0 20px;
      color: #fff;
      font-size: clamp(26px, 4vw, 38px);
    }

    .dashboard-heading span {
      color: #24be24;
    }

    .user-bar {
      margin-bottom: 20px;
      padding: 14px 18px;
      background: rgba(255,255,255,.92);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    #usuario {
      color: #073674;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .logout-button {
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      background: #073674;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: background .2s ease, transform .1s ease;
    }

    .logout-button:hover { background: #0b4d99; }
    .logout-button:active { transform: scale(.98); }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: #fff;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
      min-width: 0;
    }

    .card-label {
      color: #60708a;
      font-size: 15px;
      font-weight: 600;
    }

    .value {
      margin-top: 10px;
      color: #073674;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    @media (max-width: 800px) {
      .site-header { padding: 24px 16px 20px; }

      .header-top {
        align-items: flex-start;
        flex-direction: column;
        margin-bottom: 20px;
      }

      .header-title {
        width: 100%;
        text-align: left;
      }

      .menu-container {
        min-height: 150px;
        padding: 24px 16px;
        border-radius: 18px;
      }

      .menu { gap: 8px 18px; }
      .menu a { font-size: 14px; }

      main { padding: 0 16px 30px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .brand-mark { width: 42px; height: 42px; }
      .brand-name { font-size: 20px; }
      .header-title { font-size: 32px; }

      .menu-container {
        min-height: auto;
        padding: 20px 12px;
      }

      .menu {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px 10px;
      }

      .menu a { font-size: 13px; }

      .user-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .logout-button { width: 100%; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-mark">AL</div>
        <div class="brand-name">AL2026</div>
      </div>
      <div class="header-title">AL2026<br>Dashboard</div>
    </div>

    <nav class="menu-container" aria-label="Menú principal">
      <ul class="menu">
        <li><a href="/dashboard.html" class="active">Inicio</a></li>
        <li><a href="#estado">Estado</a></li>
        <li><a href="#api">API</a></li>
        <li><a href="#db">Base de datos</a></li>
        <li><a href="#usuario">Usuario</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="dashboard-heading">Panel de <span>control</span></h1>

    <div class="user-bar">
      <span id="usuario"></span>
      <button class="logout-button" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <div class="grid" id="estado">
      <section class="card">
        <div class="card-label">Estado de API</div>
        <div class="value" id="api">...</div>
      </section>

      <section class="card">
        <div class="card-label">Base de datos</div>
        <div class="value" id="db">...</div>
      </section>

      <section class="card">
        <div class="card-label">Bienvenido</div>
        <div class="value" id="nombre">...</div>
      </section>
    </div>
  </main>

  <script>
    async function cargarDashboard() {
      try {
        const response = await fetch('/api/session');

        if (!response.ok) {
          window.location.href = '/login.html';
          return;
        }

        const data = await response.json();
        document.getElementById('usuario').textContent = data.usuario || '';
        document.getElementById('nombre').textContent = data.nombre || data.usuario || '-';
        document.getElementById('api').textContent = 'OK';
        document.getElementById('db').textContent = 'OK';
      } catch (_) {
        window.location.href = '/login.html';
      }
    }

    async function cerrarSesion() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    cargarDashboard();
  </script>
</body>
</html>
