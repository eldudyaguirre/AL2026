<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AL2026 - Iniciar sesión</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f3f4f6; }
    .card { width: min(400px, 92vw); padding: 32px; background: #fff; border-radius: 16px; box-shadow: 0 10px 35px rgba(0,0,0,.12); }
    h1 { margin: 0 0 8px; text-align: center; }
    p { text-align: center; color: #666; margin-bottom: 24px; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
    #mensaje { min-height: 20px; margin-top: 14px; color: #c62828; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>AL2026</h1>
    <p>Inicia sesión para continuar</p>
    <form id="loginForm">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" required>
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required>
      <button type="submit">Iniciar sesión</button>
      <div id="mensaje"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const mensaje = document.getElementById('mensaje');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      mensaje.textContent = 'Verificando...';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: form.usuario.value, clave: form.clave.value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Usuario o contraseña incorrectos');
        window.location.href = '/dashboard.html';
      } catch (error) {
        mensaje.textContent = error.message;
      }
    });
  </script>
</body>
</html>
