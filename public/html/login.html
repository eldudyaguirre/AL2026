<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avícola Luisin - Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/eldudyaguirre/AL2026/main/public/img/logonuevov2.svg?v=20260901">

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>

<body>
  <main class="login-container">
    <div class="login-logo"><img src="/img/logonuevov2.svg?v=20260901" alt="Avicola y Porcina Luisin"></div>
    <h1>Inicio de Sesión</h1>

    <form id="loginForm">
      <div class="field">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Usuario" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <label class="show-password">
        <input type="checkbox" id="checkbox">
        <span>Mostrar contraseña</span>
      </label>

      <button type="submit" id="submit">Iniciar sesión</button>
      <div id="mensaje"></div>
    </form>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
