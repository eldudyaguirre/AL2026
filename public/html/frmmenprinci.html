<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/frmmenprinci.css">
  <title>Avicola Luisin - Menu Principal</title>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-mark">AL</div>
          <div class="brand-name">AL2026</div>
        </div>
        <button class="close-btn" onclick="cerrarMenu()" aria-label="Cerrar menú">×</button>
      </div>
      <div class="profile">
        <div class="profile-avatar" id="avatar">AL</div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">Usuario</div>
          <div class="profile-user" id="profile-user">Cargando...</div>
        </div>
      </div>
      <div class="menu-title">Menú principal</div>
      <nav aria-label="Menú principal">
        <ul class="menu">
          <li><a href="/html/frmmenprinci.html" class="active" onclick="cerrarMenu()"><span class="icon">⌂</span><span>Inicio</span></a></li>
          <li><a href="#estado" onclick="cerrarMenu()"><span class="icon">▣</span><span>Estado</span></a></li>
          <li><a href="#api" onclick="cerrarMenu()"><span class="icon">⌁</span><span>API</span></a></li>
          <li><a href="#db" onclick="cerrarMenu()"><span class="icon">▤</span><span>Base de datos</span></a></li>
          <li><a href="#usuario" onclick="cerrarMenu()"><span class="icon">◎</span><span>Usuario</span></a></li>
        </ul>
      </nav>
      <div class="sidebar-bottom">
        <button class="logout-link" onclick="cerrarSesion()"><span class="icon">↪</span><span>Cerrar sesión</span></button>
      </div>
    </aside>
    <div class="overlay" id="overlay" onclick="cerrarMenu()"></div>
    <section class="content">
      <header class="topbar">
        <button class="mobile-menu" onclick="abrirMenu()" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">Avicola y Porcina Luisin<span>Menú Principal</span></div>
        <div id="usuario"></div>
      </header>
      <main>
        <h1 class="heading">Panel de control</h1>
        <p class="subtitle">Resumen del estado de tu sistema AL2026</p>
        <div class="grid" id="estado">
          <section class="card" id="api"><div class="card-label">Estado de API</div><div class="value" id="api-value">...</div></section>
          <section class="card" id="db"><div class="card-label">Base de datos</div><div class="value" id="db-value">...</div></section>
          <section class="card" id="usuario-card"><div class="card-label">Bienvenido</div><div class="value" id="nombre">...</div></section>
        </div>
      </main>
    </section>
  </div>
  <script src="/js/frmmenprinci.js"></script>
</body>
</html>
